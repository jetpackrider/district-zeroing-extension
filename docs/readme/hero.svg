<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Zero Deviation: three census blocks are painted from one district into its neighbor and both districts' deviations count down from 6 to 0.">
<style>
  text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono, .dev, .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .word { font-size: 78px; font-weight: 750; fill: #fff; letter-spacing: -2.2px; }
  .kick { font-size: 25px; font-weight: 500; fill: #9FB0CC; }
  .sub { font-size: 18px; fill: #6F82A3; letter-spacing: 0.4px; }
  .num { font-size: 15px; font-weight: 700; fill: #0B1220; }
  .chip { fill: #162034; stroke: #2A3954; stroke-width: 1.5; }
  .chip.ok { fill: #0F2E25; stroke: #1F8A63; opacity: 0; animation: s3 11s linear infinite; }
  .chipname { font-size: 17px; font-weight: 600; fill: #D7E0EF; }
  .dev { font-size: 19px; font-weight: 700; opacity: 0; }
  .under { fill: #7FB0FF; } .over { fill: #FF8FA3; } .zero { fill: #4ADE80; }
  .flip { opacity: 0; }
  .ring { opacity: 0.95; }
@keyframes s0 { 0%, 18% { opacity: 1 } 20%, 96% { opacity: 0 } 97%, 100% { opacity: 1 } }.s0 { animation: s0 11s linear infinite; }@keyframes s1 { 0%, 18% { opacity: 0 } 20%, 34% { opacity: 1 } 36%, 100% { opacity: 0 } }.s1 { animation: s1 11s linear infinite; }@keyframes s2 { 0%, 34% { opacity: 0 } 36%, 50% { opacity: 1 } 52%, 100% { opacity: 0 } }.s2 { animation: s2 11s linear infinite; }@keyframes s3 { 0%, 50% { opacity: 0 } 52%, 92% { opacity: 1 } 94%, 100% { opacity: 0 } }.s3 { animation: s3 11s linear infinite; }@keyframes f0 { 0%, 18% { opacity: 0 } 20%, 92% { opacity: 1 } 96%, 100% { opacity: 0 } }.f0 { animation: f0 11s linear infinite; }@keyframes r0 { 0%, 6% { opacity: .35 } 12% { opacity: 1 } 18% { opacity: .95 } 21%, 92% { opacity: 0 } 97%, 100% { opacity: .35 } }.r0 { animation: r0 11s linear infinite; }@keyframes f1 { 0%, 34% { opacity: 0 } 36%, 92% { opacity: 1 } 96%, 100% { opacity: 0 } }.f1 { animation: f1 11s linear infinite; }@keyframes r1 { 0%, 22% { opacity: .35 } 28% { opacity: 1 } 34% { opacity: .95 } 37%, 92% { opacity: 0 } 97%, 100% { opacity: .35 } }.r1 { animation: r1 11s linear infinite; }@keyframes f2 { 0%, 50% { opacity: 0 } 52%, 92% { opacity: 1 } 96%, 100% { opacity: 0 } }.f2 { animation: f2 11s linear infinite; }@keyframes r2 { 0%, 38% { opacity: .35 } 44% { opacity: 1 } 50% { opacity: .95 } 53%, 92% { opacity: 0 } 97%, 100% { opacity: .35 } }.r2 { animation: r2 11s linear infinite; }@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .flip, .chip.ok, .dev.s3 { opacity: 1; } .ring { opacity: 0; } }</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1728"/><stop offset="1" stop-color="#0A1120"/></linearGradient>
  <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55"><stop offset="0" stop-color="#2F6BFF" stop-opacity="0.16"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="380" rx="26" fill="url(#bg)"/>
<rect width="1200" height="380" rx="26" fill="url(#glow)"/>
<rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#243149" stroke-width="2"/>

